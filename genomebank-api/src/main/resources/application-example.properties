# =======================
# APP CONFIG
# =======================
spring.application.name=genomebank-api

# =======================
# DATABASE CONFIGURATION
# =======================
spring.datasource.url=jdbc:mysql://localhost:3306/genomebank_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=TU_USUARIO
spring.datasource.password=TU_CONTRASEÑA

# =======================
# JPA / HIBERNATE CONFIG
# =======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =======================
# JWT CONFIG
# =======================
# Clave secreta para firmar los tokens JWT (usa al menos 64 caracteres)
jwt.secret=CAMBIA_ESTA_CLAVE_POR_UNA_REAL_GENERADA_ALEATORIAMENTE
# Tiempo de expiración del token (24 horas en milisegundos)
jwt.expiration=86400000
